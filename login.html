<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DreamBox | Iniciar sesión</title>
    
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="assets/dreambox-cabin-34x29.jpg" type="image/jpg">
   


</head>

<body class="auth-body">

    <div class="auth-container">

        <div class="auth-logo">
           <a href="index.html"> <span id="dream">DREAM</span><span id="box">BOX</span></a>
        </div>

        <h1>Iniciar sesión</h1>
        <p>Ingresa a tu cuenta para comprar y reservar experiencias.</p>

        <form onsubmit="iniciarSesion(event)">

            <label for="login-email">Correo electrónico</label>
            <input
                id="login-email"
                type="email"
                placeholder="tucorreo@ejemplo.com"
                required
            >

            <label for="login-password">Contraseña</label>
            <input
                id="login-password"
                type="password"
                placeholder="••••••••"
                required
            >

            <button type="submit" class="auth-button">Iniciar sesión</button>

        </form>

        <p class="auth-link">
            ¿No tienes cuenta? <a href="registro.html">Crear cuenta</a>
        </p>

        <a href="index.html" class="back-home">← Volver al inicio</a>

    </div>

    <script src="script.js"></script>

</body>

</html>
